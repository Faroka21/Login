<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه ثبت‌نام</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .signup-box {
      background: white;
      width: 320px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 14px #00000015;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #263238;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid #ccd2da;
      border-radius: 6px;
      font-family: inherit;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      text-align: center;
      font-size: 14px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>ثبت‌نام</h2>

    <form id="signupForm">
      <label for="name">نام</label>
      <input type="text" id="name" placeholder="نام خود را وارد کنید" required>

      <label for="email">ایمیل</label>
      <input type="email" id="email" placeholder="example@email.com" required>

      <label for="password">رمز عبور</label>
      <input type="password" id="password" placeholder="رمز عبور را وارد کنید" required>

      <button type="submit">ثبت‌نام</button>
      <p id="message"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // اطلاعات در حافظه مرورگر ذخیره می‌شوند.
      const user = {
        name: name,
        email: email,
        password: password
      };

      localStorage.setItem("signupUser", JSON.stringify(user));

      message.textContent = "ثبت‌نام با موفقیت انجام شد!";
      message.style.color = "green";
      form.reset();
    });
  </script>
</body>
</html>
